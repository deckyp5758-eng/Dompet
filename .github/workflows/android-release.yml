name: Build & Release APK (Google R8)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan Rilis (Opsional)'
        required: false
        default: 'Pembaruan otomatis dari GitHub Actions'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK with R8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Membuat file .env dari .env.example"
            else
              touch .env
              echo "Membuat file .env kosong"
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Menggunakan Keystore dari GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          else
            echo "Membuat signing keystore mandiri untuk rilis APK..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=DompetPintar, OU=Mobile, O=DompetPintar, L=Jakarta, ST=Jakarta, C=ID"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK with Google R8
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Prepare Release APK
        id: prepare_apk
        run: |
          mkdir -p release_output
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: File APK tidak ditemukan!"
            exit 1
          fi
          echo "Menemukan APK: $APK_FILE"
          VERSION_TAG="v1.0.${{ github.run_number }}"
          OUTPUT_APK="release_output/DompetPintar-${VERSION_TAG}.apk"
          cp "$APK_FILE" "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact (Download dari Tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: DompetPintar-Release-APK
          path: release_output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release (Download dari Tab Releases)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.version_tag }}
          name: "Dompet Pintar Rilis ${{ steps.prepare_apk.outputs.version_tag }}"
          body: |
            ## Pembaruan Aplikasi Dompet Pintar 🚀
            - **Versi Build:** `${{ steps.prepare_apk.outputs.version_tag }}`
            - **Optimasi:** Google R8 (Minified & Obfuscated) & Shrink Resources
            - **Waktu Rilis:** ${{ github.event.head_commit.timestamp || 'Auto' }}
            - **Commit:** ${{ github.sha }}

            ### Unduh APK:
            Unduh file `DompetPintar-${{ steps.prepare_apk.outputs.version_tag }}.apk` pada lampiran aset di bawah untuk langsung menginstal aplikasi di perangkat Android Anda.
          files: |
            release_output/*.apk
          draft: false
          prerelease: false
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
